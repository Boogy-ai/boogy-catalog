[package]
name = "wallet-base-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
hex = "0.4"
base64 = { version = "0.23", default-features = false, features = ["std"] }
alloy-consensus = "2"
alloy-eips = "2"
alloy-primitives = "1"
alloy-rlp = "0.3"
k256 = { version = "0.14", default-features = false, features = ["ecdsa", "alloc"] }
# Cosmos protobuf messages (TxBody/AuthInfo/SignDoc/TxRaw) WITHOUT the gRPC
# client (default-features = false drops tonic). External-signer: nothing here
# signs. Not cosmrs: its tendermint/k256 0.13 stack pins crypto-bigint 0.5.
cosmos-sdk-proto = { version = "0.27", default-features = false, features = ["std"] }
bech32 = "0.11"
sha2 = { workspace = true }
ripemd = "0.2"
# Solana tx-building types (Pubkey / Instruction / Message) WITHOUT any local
# keypair-signing path — external-signer only. Curve is Ed25519: the signature is
# a raw 64-byte sig over the serialized Message (no recovery id, no r/s split).
# `default-features = false` everywhere it still compiles for wasm32-wasip2 (no
# getrandom / no native deps).
# NEVER add solana-keypair/solana-signer or solana-transaction (its `wincode`
# feature pulls solana-signer): the single-signer wire format is assembled in
# `solana::tx`, and the System Program transfer instruction is built there too
# (solana-system-interface 3.x targets solana-instruction 3, not 4).
# The Message's codec is `wincode` (solana-message's own); bincode is gone
# (RUSTSEC-2025-0141: unmaintained, and its 3.0 is a compile_error tombstone).
bs58 = "0.5"
solana-pubkey = "4"
solana-hash = "4"
solana-sdk-ids = "3"
solana-instruction = { version = "4", default-features = false, features = ["std"] }
solana-message = { version = "6", default-features = false, features = ["std", "wincode"] }
wincode = { version = "0.6", default-features = false, features = ["alloc"] }
# `verify` enables host-mediated-signature self-verification (#15): we check the
# returned Ed25519 sig against the signed message before emitting the tx. This
# pulls a verify-only ed25519-dalek (no local key generation / no getrandom), so
# the external-signer rule above still holds.
#
# Held at 3.4.x on purpose: from 3.5 its `verify` goes through solana-ed25519
# with `rand_core` on, which pulls rand 0.10 and getrandom 0.4 into this
# verify-only, no-local-key crate. 3.4's `verify` is ed25519-dalek 2, no RNG.
solana-signature = { version = "~3.4", features = ["verify"] }
# Bitcoin tx-building types (Address / Transaction / SighashCache) + secp256k1
# (transitively pinned to 0.29.1). External-signer ONLY: we never gen/sign keys,
# so `rand` / `global-context` / `secp-recovery` / `serde` stay OFF. P2WPKH is
# UTXO-based — N inputs → N BIP143 sighashes → N secp256k1 signatures.
bitcoin = { version = "=0.32.102", default-features = false, features = ["std"] }

[dev-dependencies]
# TEST-ONLY Ed25519 signer, used to produce real signatures for the Solana
# post-assembly self-verify tests (#15). Dev-only: never compiled into the
# wasm32-wasip2 lib, so the external-signer / no-local-signing rule above holds.
ed25519-dalek = "3"
