[package]
name = "govern-base"
version = "0.1.0"
edition = "2021"
description = "Run on-chain-style governance for your community or app: members propose, co-sponsor, vote, and a passed proposal can trigger real effects."

[dependencies]
boogy-sdk = { git = "https://github.com/Boogy-ai/boogy-sdk" }
govern-base-core = { path = "govern-base-core" }
wit-bindgen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }

[lib]
crate-type = ["cdylib"]

[build-dependencies]
# build.rs syncs the WIT files matching this SDK revision into ./wit so
# wit_bindgen::generate! (manifest-relative literal path) always resolves.
boogy-wit = { git = "https://github.com/Boogy-ai/boogy-sdk" }
